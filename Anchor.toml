[toolchain]
anchor_version = "1.1.2"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
asset_controller = "7tXjmbkZVY3Gmg9kDBebcNXT1yC5pyoxxXVLwdbv9tvP"
identity_registry = "GZsnjqT3c5zbHqsctrJ4EG4rbEfo7ZXyyUG7aDJNmxfA"
policy_engine = "FsE8mCJyvgMzqJbfHbJQm3iuf3cRZC6n2vZi1Q8rQCy2"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = [
  "programs/asset_controller",
  "programs/identity_registry",
  "programs/policy_engine",
]
idls = "clients/rwa-token-sdk/src/programs/idls"
types = "clients/rwa-token-sdk/src/programs/types"

[scripts]
test = "cd clients/rwa-token-sdk && corepack yarn test"

[surfpool]
startup_wait = 30000
shutdown_wait = 2000
rpc_port = 8899
ws_port = 8900
host = "127.0.0.1"
# These fixtures create all state locally; no devnet accounts need cloning.
online = false
block_production_mode = "transaction"
log_level = "info"
